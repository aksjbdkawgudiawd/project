name: Verify marketplace MVP
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: bash scripts/setup.sh
      - run: npm test
      - run: npm run build
      - run: env -u BOT_TOKEN .venv/bin/python -m bot
      - run: git diff --check
